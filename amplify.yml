# Build settings for AWS Amplify Hosting.
# Amplify reads this file automatically when you connect the GitHub repo.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - node -v
        # Stop early with a clear message if the API address is missing
        - 'if [ -z "$VITE_API_URL" ]; then echo "ERROR: VITE_API_URL is not set. Add it in Amplify: Hosting > Environment variables, then redeploy."; exit 1; fi'
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Show which API address is baked into this build (check it in the build log)
        - echo "VITE_API_URL=$VITE_API_URL"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
